# storage
path: /tmp/bakemono-test.vol
size_mb: 4096
avg_chunk_size: 8000

schema: http                  # support http and https
port: 80                    # port for balancer
ssl_certificate:
ssl_certificate_key:
location:                   
  - pattern: /

# upstream 
tcp_health_check: true
health_check_interval: 10      # health check interval (second)
# The maximum number of requests that the balancer can handle at the same time
# 0 refers to no limit to the maximum number of requests
max_allowed: 0
upstream:                     # route matching for reverse proxy
  proxy_pass:                   # URL of the reverse proxy
  - "http://10.62.216.7"
  - "http://10.62.216.8"
  balance_mode: consistent-hash     # load balancing algorithm
