# storage
storage:
  - path: /tmp/bakemono-demo-http/cache1.db
    size_mb: 4096
  - path: /tmp/bakemono-demo-http/cache2.db
    size_mb: 4096

# Local stripes currently size their directory for 8192-byte objects;
# the external engine's avg_chunk_size option does not apply here.
ram_cache_size_mb: 1024
schema: http                        # support http and https
port: 80                            # port for balancer
ssl_certificate:
ssl_certificate_key:
location:                   
  - pattern: /

# upstream 
tcp_health_check: true
health_check_interval: 10           # health check interval (second)
upstream:                      
  proxy_pass:                  
  - "http://10.62.216.7"
  - "http://10.62.216.8"
  balance_mode: consistent-hash     # load balancing algorithm

# log
access_log_path: logs/access.log
zap_config: 
  level: "debug"
  encoding: "console"
  development: true
  encoderConfig:
    messageKey: "Msg"
    levelKey: "Level"
    timeKey: "Time"
    nameKey: "Name"
    callerKey: "Caller"
    stacktraceKey: "St"
    levelEncoder: "capital"
    timeEncoder: "iso8601"
    durationEncoder: "string"
    callerEncoder: "short"
  outputPaths:
    - "stdout"
    - "logs/bakemono.log"
  errorOutputPaths:
    - "stderr"
    - "logs/error.log"
