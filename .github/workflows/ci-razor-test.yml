name: razor build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build main and all demos
        run: |
          make build
          go build ./...
      - name: Test acceptance tool cleanup
        run: python3 -m unittest discover -s tools -p '*_test.py'
      - name: Test including real binary MISS to HIT
        run: make test
      - name: Race tests including real binary
        run: make test-race
